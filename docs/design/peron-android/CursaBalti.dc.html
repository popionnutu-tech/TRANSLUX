<!doctype html>

<div style="width: 390px; height: 844px; background: #f4f0ed; display: flex; flex-direction: column; box-sizing: border-box; padding: 56px 16px 24px 16px; gap: 14px;">

    </div>
  </div>

  <div style="display: flex; gap: 10px;">
    <div style="flex-grow: 1; height: 56px; border: 2px solid #ddd9d5; background: #ffffff; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #333;">Absent</div>

</div>
