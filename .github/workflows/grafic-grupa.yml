name: grafic-grupa

# Graficul de mâine pleacă singur în grupa Mejgorod (Ion, 10.09: «zilnic așa
# să se posteze în grupă»). 10:30 UTC = 13:30 Chișinău vara (12:30 iarna) —
# după ce dispecerii au completat graficul (~11:00–12:30). Dacă ziua a fost
# deja bifată de dispecer, endpoint-ul nu face nimic.

on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Post tomorrow's grafic to the Mejgorod group
        run: |
          code=$(curl -s -m 120 -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://central-hub-md.vercel.app/api/cron/grafic-grupa)
          echo "grafic-grupa responded: HTTP $code"
          cat /tmp/out.json
          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            echo "::warning::grafic-grupa endpoint returned HTTP $code"
          fi
