name: tiki-mobilet

# Importul zilnic al biletelor din cabinetul Mobilet (ION-160): vânzările și cursele ultimelor 8 zile până ieri intră în
# Numărare → Bilete aparat (fără dubluri: biletele deja importate se sar). Ion, 01.10: «fă ca o dată în zi, pe ziua de
# ieri, să lucreze automatizarea: să intre pe site și să colecteze datele de bilete».
# Rulează pe GitHub infra: Vercel Hobby are ambele sloturi de cron ocupate. A doua rulare = retry (idempotent) și
# continuarea refacerii.
# ION-166: totul NOAPTEA — baza (Supabase NANO) a încremenit pe 01.10 după o zi de refaceri grele. 21:05 / 00:30 / 01:30 UTC
# = 00:05 / 03:30 / 04:30 Chișinău vara (EEST), 23:05 / 02:30 / 03:30 iarna; ruta de refacere lucrează doar 23:00–05:00
# Chișinău. Pornirea de la miezul nopții (ION-167) dă timp refacerilor mari (toate lunile, ~1 h în pași mici).

on:
  schedule:
    - cron: '5 21 * * *'
    - cron: '30 0 * * *'
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      from:
        description: 'De la (YYYY-MM-DD), gol = ultimele 8 zile'
        required: false
      to:
        description: 'Până la (YYYY-MM-DD), gol = ieri'
        required: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Import Mobilet
        env:
          FROM: ${{ github.event.inputs.from }}
          TO: ${{ github.event.inputs.to }}
        run: |
          q=""
          if [ -n "$FROM" ] && [ -n "$TO" ]; then q="?from=$FROM&to=$TO"; fi
          code=$(curl -s -m 320 -o /tmp/body -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://central-hub-md.vercel.app/api/cron/tiki-mobilet$q")
          echo "tiki-mobilet responded: HTTP $code"
          cat /tmp/body
          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            echo "::warning::tiki-mobilet returned HTTP $code"
            exit 1
          fi
      # ION-159 / ION-166: refacerea vederilor Bilete aparat pe lunile curselor importate, în pași mici (≤ 10 s fiecare,
      # ~45 s pe apel). Rulează și când importul a picat: golește ce a rămas în coadă. Se oprește când cozile sunt goale
      # («gata»), când ruta spune că a ieșit din fereastra de noapte («oprit») sau după 60 de apeluri; restul — noaptea
      # următoare.
      - name: Refacere vederi
        if: always()
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -m 90 -o /tmp/body -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "https://central-hub-md.vercel.app/api/cron/tiki-refacere")
            echo "tiki-refacere #$i: HTTP $code"
            head -c 600 /tmp/body; echo
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "::warning::tiki-refacere returned HTTP $code"
              exit 1
            fi
            grep -q '"gata":true' /tmp/body && break
            grep -q '"oprit"' /tmp/body && break
          done
